<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者模式｜罗途查</title><link rel="icon" href="assets/brand/localtourchina-mark.webp" type="image/webp"><link rel="stylesheet" href="assets/admin.css"><meta name="robots" content="noindex,nofollow"></head><body><header class="admin-head"><a href="index.html"><img src="assets/brand/localtourchina-header.webp" alt="罗途查 Localtour China"></a><div><b>管理者模式</b><span id="sessionLabel">订单 · 报价 · Notion · AI协作</span></div><button id="logout" class="ghost" type="button" hidden>退出</button></header><main>
<section class="login-card" id="loginCard"><span class="eyebrow">SECURE OPERATOR LOGIN</span><h1>登录管理者模式</h1><p>输入管理员邮箱，我们会发送一次性安全登录链接。无需另记密码。</p><form id="loginForm"><label>管理员邮箱<input id="adminEmail" type="email" autocomplete="username" required></label><button type="submit">发送免密码登录邮件</button><p class="login-help">只有已加入管理员名单的邮箱才能查看客人资料和付款凭证。</p><p id="loginStatus" role="status"></p></form></section>
<section id="workspace" hidden><div class="toolbar"><div><span class="eyebrow">OPERATIONS</span><h1>订单工作台</h1><p>先处理需要行动的订单，再查看全部记录。</p></div><button id="refresh" type="button">刷新订单</button></div><div class="metrics" id="metrics"></div><div class="filters"><input id="search" type="search" placeholder="搜索申请编号、姓名、联系方式"><select id="statusFilter"><option value="">全部状态</option><option value="received">已提交</option><option value="reviewing">审核中</option><option value="quoted">已报价</option><option value="deposit_paid">定金已确认</option><option value="confirmed">预订已确认</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div><div class="work-grid"><section class="order-list" id="orderList" aria-label="订单列表"></section><section class="order-detail" id="orderDetail"><div class="empty">请从左侧选择一条订单。</div></section></div></section></main><script src="assets/supabase-config.js"></script><script src="assets/admin.js?v=2"></script></body></html>
